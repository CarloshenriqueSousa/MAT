version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      python-deps:
        patterns: ["*"]
