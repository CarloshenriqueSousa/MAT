name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uv run --python 3.12 --extra dev ruff check .
      - name: Pytest + cobertura
        # Testes de integração Docker são pulados se a imagem mat-sandbox não existir.
        run: uv run --python 3.12 --extra dev pytest --cov=mat --cov-report=term-missing
