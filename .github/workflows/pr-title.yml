name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          requireScope: false
          # Descrição em português começa com minúscula (ver CONTRIBUTING.md).
          subjectPattern: ^[a-zà-ú0-9].+$
          subjectPatternError: |
            A descrição "{subject}" do título deve começar com letra minúscula ou número.
