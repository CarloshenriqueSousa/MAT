# Perfis de modelo por papel. Os prompts de sistema ficam junto de cada agente
# (DEFAULT_*_SYSTEM_PROMPT em src/mat/agents/) e podem ser sobrescritos pelo construtor.
# D33: todos os agentes usam claude-opus-5-5.
agents:
  analyst:
    model: "claude-opus-5-5"
    temperature: 0.2
    max_tokens: 4096

  programmer:
    model: "claude-opus-5-5"
    temperature: 0.3
    max_tokens: 8192

  reviewer:
    model: "claude-opus-5-5"
    temperature: 0.1
    max_tokens: 4096

  tester_happy:
    model: "claude-opus-5-5"
    temperature: 0.2
    max_tokens: 4096

  verifier:
    model: "claude-opus-5-5"
    temperature: 0.1
    max_tokens: 4096
